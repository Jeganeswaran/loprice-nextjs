<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="apple-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d13034"/>
      <stop offset="50%" stop-color="#bf2629"/>
      <stop offset="100%" stop-color="#6f0f12"/>
    </linearGradient>
    <radialGradient id="apple-hl" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS applies its own rounding, so use a square with small corner -->
  <rect width="180" height="180" rx="40" fill="url(#apple-bg)"/>
  <rect width="180" height="180" rx="40" fill="url(#apple-hl)"/>

  <g transform="translate(40 56)">
    <rect x="0" y="0" width="100" height="56" rx="12" fill="#fff"/>
    <rect x="10" y="11" width="20" height="17" rx="4" fill="#bf2629"/>
    <rect x="38" y="11" width="20" height="17" rx="4" fill="#bf2629"/>
    <rect x="66" y="11" width="20" height="17" rx="4" fill="#bf2629"/>
    <circle cx="94" cy="40" r="6" fill="#ffd28a" opacity="0.8"/>
    <circle cx="22" cy="62" r="9" fill="#fff"/>
    <circle cx="78" cy="62" r="9" fill="#fff"/>
    <circle cx="22" cy="62" r="4" fill="#bf2629"/>
    <circle cx="78" cy="62" r="4" fill="#bf2629"/>
  </g>
</svg>
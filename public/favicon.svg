<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favA-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d03034"/>
      <stop offset="55%" stop-color="#bf2629"/>
      <stop offset="100%" stop-color="#7d1215"/>
    </linearGradient>
    <linearGradient id="favA-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile -->
  <rect width="64" height="64" rx="16" fill="url(#favA-bg)"/>

  <!-- Top sheen -->
  <rect width="64" height="32" rx="16" fill="url(#favA-shine)"/>
  <rect y="16" width="64" height="16" fill="url(#favA-shine)" opacity="0.4"/>

  <!-- Diagonal road line -->
  <path d="M-4 52 L68 12" stroke="#fff" stroke-width="2" stroke-opacity="0.18" stroke-linecap="round"/>

  <!-- Monogram L -->
  <path d="M22 16 L22 42 L44 42"
        stroke="#fff"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Speed dot -->
  <circle cx="47" cy="20" r="2.2" fill="#fff" fill-opacity="0.85"/>
</svg>